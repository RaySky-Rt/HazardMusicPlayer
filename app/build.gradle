plugins { id 'com.android.application' }

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = keystorePropertiesFile.exists()
        ? rootProject.file(keystoreProperties['storeFile']) : null
def hasReleaseSigning = releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace 'com.hazard.music'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.hazard.music'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'androidx.core:core:1.9.0'
}


tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
